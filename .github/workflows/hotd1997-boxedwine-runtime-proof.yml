name: HOTD 1997 BoxedWine Runtime Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotd1997-boxedwine-runtime-proof.yml'

permissions:
  contents: read

jobs:
  hotd-normal-core-semantic-launch-proof:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 55
    env:
      DEBIAN_FRONTEND: noninteractive
      BOXEDWINE_SOURCE_SHA: 5a2195ba47a169455c2dbe6bcb4bae4c256c9bad
      BOXEDWINE_OFFLINE_BUNDLE: https://sourceforge.net/projects/boxedwine/files/Builds/20.1.2/BoxedWine%2020.1.2%20-%20Windows.zip/download
      BOXEDWINE_OFFLINE_SHA256: 69bbc533af07aa39ffabbf49a04e9d0d6c275d0698aec8d5124fe0d3bc57b53e
      FULL_WINE17_URL: https://sourceforge.net/projects/boxedwine/files/FileSystems/Full/v5/Debian10-Wine-1.7.zip/download
      FULL_WINE50_URL: https://sourceforge.net/projects/boxedwine/files/FileSystems/Full/v5/Debian10-Wine-5.0.zip/download
      PCZONE_CD_ARCHIVE: https://pixsoriginadventures.co.uk/PCZone/PC%20Zone%2067%20%28September%201998%29/CDZone%2367.rar
      PCZONE_RAR_SHA256: 1a8695d904886e028b4e14aa59b85934c1d867ed03d2f3a18c9d202691efa1ba
      HOTD_INSTALLER_SHA256: 6150da85cd5e7ba88bbe722aba8202d5f8726b66eb1e8614b2bda5e89ae76944
      HOTD_EXE_SHA256: 96951e783957858d20d181884ecd0566d53f91a88586345dc6fd126ca986d29f
    steps:
      - name: Install historical build and sterile display tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git curl unzip file cmake build-essential \
            libsdl2-dev libssl-dev libminizip-dev libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri \
            xvfb x11-utils xdotool imagemagick unar p7zip-full ccd2iso

      - name: Checkout exact BoxedWine 20.1.2 source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lab" "$GITHUB_WORKSPACE/report"
          cd "$GITHUB_WORKSPACE/lab"
          git init -q Boxedwine
          cd Boxedwine
          git remote add origin https://github.com/danoon2/Boxedwine.git
          git fetch -q --depth=1 origin "$BOXEDWINE_SOURCE_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BOXEDWINE_SOURCE_SHA"
          git show -s --format='BOXEDWINE_SOURCE_SHA=%H%nBOXEDWINE_SOURCE_DATE=%cI%nBOXEDWINE_SOURCE_SUBJECT=%s' HEAD \
            | tee "$GITHUB_WORKSPACE/report/source-provenance.env"

      - name: Build Web-aligned normal CPU plus softMMU runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab/Boxedwine/project/linux"
          sh build.sh > "$GITHUB_WORKSPACE/report/build-normal.log" 2>&1
          test -x bin/boxedwine
          file bin/boxedwine | tee "$GITHUB_WORKSPACE/report/boxedwine-normal-type.txt"
          sha256sum bin/boxedwine | tee "$GITHUB_WORKSPACE/report/boxedwine-normal-sha256.txt"
          {
            echo CPU_CORE=normal
            echo MMU=softmmu
            echo THREAD_MODEL=singleThreaded
            echo WEB_EXECUTION_CORE_ALIGNMENT=normal_plus_softmmu
          } | tee "$GITHUB_WORKSPACE/report/normal-core-contract.env"

      - name: Fetch official split and combined filesystem roots
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          mkdir -p portable full-roots

          curl --fail --location --retry 3 --output boxedwine-offline.zip "$BOXEDWINE_OFFLINE_BUNDLE"
          test "$(sha256sum boxedwine-offline.zip | awk '{print $1}')" = "$BOXEDWINE_OFFLINE_SHA256"
          unzip -q boxedwine-offline.zip -d portable
          DEBIAN="$(find portable -type f -iname 'debian10.zip' -print -quit)"
          W17="$(find portable -type f -iname 'Wine-1.7.zip' -print -quit)"
          W50="$(find portable -type f -iname 'Wine-5.0.zip' -print -quit)"
          test -n "$DEBIAN" && test -n "$W17" && test -n "$W50"
          cp "$DEBIAN" full-roots/debian10.zip
          printf '%s\n' "$DEBIAN" > debian.path
          printf '%s\n' "$W17" > wine17.path
          printf '%s\n' "$W50" > wine50.path

          curl --fail --location --retry 3 --output full-roots/Debian10-Wine-1.7.zip "$FULL_WINE17_URL"
          curl --fail --location --retry 3 --output full-roots/Debian10-Wine-5.0.zip "$FULL_WINE50_URL"
          unzip -tq full-roots/Debian10-Wine-1.7.zip >/dev/null
          unzip -tq full-roots/Debian10-Wine-5.0.zip >/dev/null
          unzip -tq full-roots/debian10.zip >/dev/null
          sha256sum full-roots/*.zip | tee "$GITHUB_WORKSPACE/report/root-sha256.txt"
          stat -c '%n %s bytes' full-roots/*.zip | tee "$GITHUB_WORKSPACE/report/root-sizes.txt"
          {
            echo SPLIT_ROOTS_FETCH_PASS=true
            echo FULL_ROOTS_FETCH_PASS=true
            echo FULL50_DEBIAN_DEPENDENCY_SATISFIED=true
          } | tee "$GITHUB_WORKSPACE/report/root-gate.env"

      - name: Start sterile Xvfb display
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp > "$GITHUB_WORKSPACE/report/xvfb.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/lab/xvfb.pid"
          sleep 2
          DISPLAY=:99 xdpyinfo > "$GITHUB_WORKSPACE/report/xdpyinfo.txt"

      - name: Prove Wine semantically on four normal-core lanes
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          BW="$GITHUB_WORKSPACE/lab/Boxedwine/project/linux/bin/boxedwine"
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"

          : > "$REPORT/wine-semantic-baseline.tsv"
          printf 'lane\texit_code\twine_banner\tclean_shutdown\tcrash\tverdict\n' >> "$REPORT/wine-semantic-baseline.tsv"

          probe() {
            local lane="$1"; shift
            local log="$REPORT/wine-$lane.log"
            local root="root-wine-$lane"
            rm -rf "$root"; mkdir -p "$root"
            set +e
            timeout 25s "$BW" -root "$root" "$@" -nosound /bin/wine --version > "$log" 2>&1
            local rc=$?
            set -e

            local banner=false shutdown=false crash=false verdict=FAIL
            grep -Eq '^wine-[0-9]' "$log" && banner=true || true
            grep -q 'Boxedwine shutdown' "$log" && shutdown=true || true
            if [[ "$rc" -eq 139 ]] || grep -Eiq 'starting debugger|winedbg|assertion failed|double free|corruption|unhandled exception|segmentation fault|fatal signal|core dumped' "$log"; then
              crash=true
            fi
            if [[ "$banner" == true && "$shutdown" == true && "$crash" == false ]]; then
              verdict=PASS
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$lane" "$rc" "$banner" "$shutdown" "$crash" "$verdict" >> "$REPORT/wine-semantic-baseline.tsv"
            echo "--- $lane rc=$rc verdict=$verdict ---"
            cat "$log"
          }

          probe split17 -zip "$(cat debian.path)" -zip "$(cat wine17.path)"
          probe split50 -zip "$(cat debian.path)" -zip "$(cat wine50.path)"
          probe full17 -zip full-roots/Debian10-Wine-1.7.zip
          probe full50 -zip full-roots/Debian10-Wine-5.0.zip

          PASS_COUNT="$(awk -F '\t' '$6=="PASS" {n++} END{print n+0}' "$REPORT/wine-semantic-baseline.tsv")"
          {
            echo WINE_SEMANTIC_PASS_COUNT="$PASS_COUNT"
            echo WINE_TOTAL_LANES=4
            if [[ "$PASS_COUNT" -gt 0 ]]; then
              echo NORMAL_HOST_RUNTIME_GATE=PASS
            else
              echo NORMAL_HOST_RUNTIME_GATE=FAIL
            fi
          } | tee "$REPORT/wine-semantic-gate.env"
          cat "$REPORT/wine-semantic-baseline.tsv"
          test "$PASS_COUNT" -gt 0

      - name: Recover genuine SEGA HOTD demo ephemerally
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          mkdir -p cd-outer cd-root installer-inner
          curl --fail --location --retry 3 --output cdzone67.rar "$PCZONE_CD_ARCHIVE"
          test "$(sha256sum cdzone67.rar | awk '{print $1}')" = "$PCZONE_RAR_SHA256"
          unar -f -o cd-outer cdzone67.rar >/dev/null
          IMG="$(find cd-outer -type f -iname '*.img' -print -quit)"
          test -n "$IMG"
          ccd2iso "$IMG" cdzone67.iso >/dev/null
          7z x -y -ocd-root cdzone67.iso >/dev/null
          INSTALLER="$(find cd-root -type f -ipath '*/Gamedemo/Win95/hotd/Install.exe' -print -quit)"
          test -n "$INSTALLER"
          test "$(sha256sum "$INSTALLER" | awk '{print $1}')" = "$HOTD_INSTALLER_SHA256"
          7z x -y -oinstaller-inner "$INSTALLER" >/dev/null
          GAME_DIR="$(find installer-inner -type d -iname 'hotd_demo' -print -quit)"
          GAME_EXE="$(find "$GAME_DIR" -maxdepth 1 -type f -iname 'THOTDEMO.exe' -print -quit)"
          test -n "$GAME_EXE"
          test "$(sha256sum "$GAME_EXE" | awk '{print $1}')" = "$HOTD_EXE_SHA256"
          printf '%s\n' "$GAME_DIR" > game-dir.path
          find "$GAME_DIR" -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort > "$REPORT/hotd-game-directory.txt"
          {
            echo PACKAGE_IDENTITY_PASS=true
            echo HOTD_INSTALLER_SHA256="$HOTD_INSTALLER_SHA256"
            echo HOTD_EXE_SHA256="$HOTD_EXE_SHA256"
            echo HOTD_BINARY_PERSISTED=NO
            echo HOTD_BINARY_UPLOADED=NO
          } | tee "$REPORT/hotd-identity.env"

      - name: Run genuine HOTD launch matrix on every green Wine lane
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          BW="$GITHUB_WORKSPACE/lab/Boxedwine/project/linux/bin/boxedwine"
          GAME_DIR="$(cat game-dir.path)"
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"

          import -display :99 -window root "$RUNNER_TEMP/pre-game.png" 2>/dev/null || true
          : > "$REPORT/hotd-launch.tsv"
          printf 'lane\tstate\tcrash\tvisual_delta_from_blank\tmotion_delta\twindows\tlaunch_verdict\tmotion_verdict\n' >> "$REPORT/hotd-launch.tsv"
          LAUNCH_PASS_COUNT=0
          MOTION_PASS_COUNT=0

          for lane in split17 split50 full17 full50; do
            if ! awk -F '\t' -v l="$lane" '$1==l && $6=="PASS" {ok=1} END{exit !ok}' "$REPORT/wine-semantic-baseline.tsv"; then
              printf '%s\tSKIPPED\tNA\tNA\tNA\tNA\tBASELINE_FAIL\tNA\n' "$lane" >> "$REPORT/hotd-launch.tsv"
              continue
            fi

            ROOT="root-hotd-$lane"
            LOG="$REPORT/hotd-$lane.log"
            TREE="$REPORT/hotd-$lane-window-tree.txt"
            F1="$RUNNER_TEMP/hotd-$lane-1.png"
            F2="$RUNNER_TEMP/hotd-$lane-2.png"
            rm -rf "$ROOT" "$F1" "$F2"
            mkdir -p "$ROOT"

            ZIP_ARGS=()
            case "$lane" in
              split17) ZIP_ARGS=(-zip "$(cat debian.path)" -zip "$(cat wine17.path)") ;;
              split50) ZIP_ARGS=(-zip "$(cat debian.path)" -zip "$(cat wine50.path)") ;;
              full17)  ZIP_ARGS=(-zip full-roots/Debian10-Wine-1.7.zip) ;;
              full50)  ZIP_ARGS=(-zip full-roots/Debian10-Wine-5.0.zip) ;;
            esac

            set +e
            "$BW" -root "$ROOT" "${ZIP_ARGS[@]}" \
              -mount_drive "$GAME_DIR" d -w /mnt/d_drive \
              -resolution 640x480 -bpp 16 -nosound -title "HOTD-$lane" \
              /bin/wine 'd:\\THOTDEMO.exe' > "$LOG" 2>&1 &
            PID=$!
            set -e

            sleep 8
            import -display :99 -window root "$F1" 2>/dev/null || true
            xwininfo -root -tree > "$TREE" 2>&1 || true
            xdotool key Return 2>/dev/null || true
            xdotool mousemove 512 384 click 1 2>/dev/null || true
            sleep 10
            import -display :99 -window root "$F2" 2>/dev/null || true

            RC=NA
            if kill -0 "$PID" 2>/dev/null; then
              STATE=ALIVE
            else
              set +e
              wait "$PID"; RC=$?
              set -e
              STATE="EXIT_$RC"
            fi

            CRASH=false
            if [[ "$RC" == 139 ]] || grep -Eiq 'starting debugger|winedbg|assertion failed|double free|corruption|unhandled exception|segmentation fault|fatal signal|core dumped' "$LOG"; then
              CRASH=true
            fi

            VISUAL=NA
            MOTION=NA
            if [[ -s "$RUNNER_TEMP/pre-game.png" && -s "$F1" ]]; then
              set +e
              D="$(compare -metric AE "$RUNNER_TEMP/pre-game.png" "$F1" null: 2>&1)"
              set -e
              [[ "$D" =~ ^[0-9]+$ ]] && VISUAL="$D"
            fi
            if [[ -s "$F1" && -s "$F2" ]]; then
              set +e
              D="$(compare -metric AE "$F1" "$F2" null: 2>&1)"
              set -e
              [[ "$D" =~ ^[0-9]+$ ]] && MOTION="$D"
            fi

            WINDOWS="$(grep -E '0x[0-9a-f]+ ' "$TREE" 2>/dev/null | wc -l | tr -d ' ')"
            LAUNCH=FAIL
            MOTION_VERDICT=FAIL
            if [[ "$STATE" == ALIVE && "$CRASH" == false && "$VISUAL" != NA && "$VISUAL" -gt 0 ]]; then
              LAUNCH=PASS
              LAUNCH_PASS_COUNT=$((LAUNCH_PASS_COUNT + 1))
            fi
            if [[ "$LAUNCH" == PASS && "$MOTION" != NA && "$MOTION" -gt 0 ]]; then
              MOTION_VERDICT=PASS
              MOTION_PASS_COUNT=$((MOTION_PASS_COUNT + 1))
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$lane" "$STATE" "$CRASH" "$VISUAL" "$MOTION" "$WINDOWS" "$LAUNCH" "$MOTION_VERDICT" \
              >> "$REPORT/hotd-launch.tsv"
            echo "--- HOTD $lane ---"
            tail -n 160 "$LOG" || true
            cat "$TREE" | head -n 120 || true

            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
            rm -f "$F1" "$F2"
          done

          rm -f "$RUNNER_TEMP/pre-game.png"
          {
            echo HOTD_LAUNCH_PASS_COUNT="$LAUNCH_PASS_COUNT"
            echo HOTD_MOTION_PASS_COUNT="$MOTION_PASS_COUNT"
            if [[ "$LAUNCH_PASS_COUNT" -gt 0 ]]; then
              echo BOXEDWINE_NATIVE_HOTD_LAUNCH_PASS=true
            else
              echo BOXEDWINE_NATIVE_HOTD_LAUNCH_PASS=false
            fi
            if [[ "$MOTION_PASS_COUNT" -gt 0 ]]; then
              echo BOXEDWINE_NATIVE_HOTD_MOTION_PASS=true
            else
              echo BOXEDWINE_NATIVE_HOTD_MOTION_PASS=false
            fi
          } | tee "$REPORT/hotd-launch-gate.env"
          cat "$REPORT/hotd-launch.tsv"

      - name: Stop sterile Xvfb
        if: always()
        shell: bash
        run: |
          PID="$(cat "$GITHUB_WORKSPACE/lab/xvfb.pid" 2>/dev/null || true)"
          [[ -n "$PID" ]] && kill "$PID" 2>/dev/null || true

      - name: Upload text-only proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotd1997-normal-semantic-launch-report
          path: ${{ github.workspace }}/report
          if-no-files-found: warn
          retention-days: 30
