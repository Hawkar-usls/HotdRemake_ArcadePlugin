name: HOTD 1997 BoxedWine Runtime Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotd1997-boxedwine-runtime-proof.yml'

permissions:
  contents: read

jobs:
  probe-offline-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOXEDWINE_OFFLINE_BUNDLE: https://sourceforge.net/projects/boxedwine/files/Builds/20.1.2/BoxedWine%2020.1.2%20-%20Windows.zip/download
    steps:
      - name: Fetch official offline BoxedWine bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rootfs-probe/report" "$RUNNER_TEMP/rootfs-probe/portable"
          cd "$RUNNER_TEMP/rootfs-probe"
          curl --fail --location --retry 3 --retry-all-errors \
            --output boxedwine-offline.zip "$BOXEDWINE_OFFLINE_BUNDLE"
          test -s boxedwine-offline.zip
          file -b boxedwine-offline.zip | tee report/bundle-type.txt
          sha256sum boxedwine-offline.zip | tee report/bundle-sha256.txt
          unzip -tq boxedwine-offline.zip | tee report/bundle-test.txt
          unzip -q boxedwine-offline.zip -d portable

      - name: Inventory bundled filesystem layers
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rootfs-probe"
          find portable -type f -iname '*.zip' -printf '%p\t%s bytes\n' | sort | tee report/bundled-zips.txt
          : > report/bundled-zip-inspection.txt
          while IFS= read -r z; do
            echo "===== ${z#portable/} =====" | tee -a report/bundled-zip-inspection.txt
            sha256sum "$z" | tee -a report/bundled-zip-inspection.txt
            unzip -l "$z" 2>/dev/null | sed -n '1,45p' | tee -a report/bundled-zip-inspection.txt || true
          done < <(find portable -type f -iname '*.zip' | sort)
          echo "ZIP_COUNT=$(find portable -type f -iname '*.zip' | wc -l)" | tee report/status.env

      - name: Upload filesystem inventory only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxedwine-20.1.2-offline-rootfs-inventory
          path: ${{ runner.temp }}/rootfs-probe/report
          if-no-files-found: warn
          retention-days: 30
