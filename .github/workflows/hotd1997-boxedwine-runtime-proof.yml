name: HOTD 1997 BoxedWine Runtime Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotd1997-boxedwine-runtime-proof.yml'

permissions:
  contents: read

jobs:
  build-boxedwine-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout HOTD proof branch
        uses: actions/checkout@v4
        with:
          ref: research/hotd1997-pc-demo-boxedwine
          path: hotd-proof

      - name: Checkout BoxedWine upstream
        uses: actions/checkout@v4
        with:
          repository: danoon2/Boxedwine
          ref: 2473488cfcf1ba914daf5aad097da0c59bb16073
          path: upstream/Boxedwine
          fetch-depth: 1

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Patch modern Emscripten C++ linker compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/Boxedwine/project/emscripten
          sed -i 's/@$(CC) $(ALL) -o $@ $(LDFLAGS)/@$(CXX) $(ALL) -o $@ $(LDFLAGS)/' makefile

      - name: Build single-threaded BoxedWine Web runtime
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/Boxedwine/project/emscripten
          make release
          test -f Build/Release/boxedwine.html
          test -f Build/Release/boxedwine.js
          test -f Build/Release/boxedwine.wasm

      - name: Assemble GPL runtime proof only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-artifact/runtime proof-artifact/evidence
          cp -a upstream/Boxedwine/project/emscripten/Build/Release/. proof-artifact/runtime/
          cp upstream/Boxedwine/license.txt proof-artifact/evidence/BOXEDWINE_GPL2.txt
          cp hotd-proof/research/HOTD1997_DEMO_SOURCE_GATE.md proof-artifact/evidence/
          cp hotd-proof/research/hotd1997-demo-manifest.json proof-artifact/evidence/
          cat > proof-artifact/evidence/STATUS.txt <<'EOF'
          BOXEDWINE_WASM_RUNTIME_BUILD=PASS
          BOXEDWINE_UPSTREAM_SHA=2473488cfcf1ba914daf5aad097da0c59bb16073
          LINKER_COMPAT_PATCH=CC_TO_CXX
          HOTD_DEMO_BINARY_INCLUDED=NO
          EOF

      - name: Upload BoxedWine Web runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: hotd1997-boxedwine-web-runtime
          path: proof-artifact
          if-no-files-found: error
          retention-days: 30

  smoke-hotd-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PCZONE_CD_ARCHIVE: https://pixsoriginadventures.co.uk/PCZone/PC%20Zone%2067%20%28September%201998%29/CDZone%2367.rar
      BOXEDWINE_FS: https://sourceforge.net/projects/boxedwine/files/FileSystems/Full/v5/Debian10-Wine-5.0.zip/download
      BOXEDWINE_BASE_FS: https://sourceforge.net/projects/boxedwine/files/FileSystems/Split/v5/debian10.zip/download
      HOTD_INSTALLER_SHA256: 6150da85cd5e7ba88bbe722aba8202d5f8726b66eb1e8614b2bda5e89ae76944
    steps:
      - name: Checkout BoxedWine upstream
        uses: actions/checkout@v4
        with:
          repository: danoon2/Boxedwine
          ref: 2473488cfcf1ba914daf5aad097da0c59bb16073
          path: Boxedwine
          fetch-depth: 1

      - name: Install native build and sterile display tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential libsdl2-dev libssl-dev libminizip-dev \
            libcurl4-openssl-dev libgl1-mesa-dev libglu1-mesa-dev \
            xvfb x11-utils imagemagick unar p7zip-full ccd2iso file curl unzip

      - name: Build native BoxedWine
        shell: bash
        run: |
          set -euo pipefail
          cd Boxedwine/project/linux
          make
          test -x Build/Release/boxedwine
          ./Build/Release/boxedwine -version > "$RUNNER_TEMP/boxedwine-version.txt" 2>&1 || true

      - name: Fetch official BoxedWine filesystem layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hotd-smoke/report"
          cd "$RUNNER_TEMP/hotd-smoke"
          curl --fail --location --retry 3 --retry-all-errors \
            --output Debian10-Wine-5.0.zip "$BOXEDWINE_FS"
          curl --fail --location --retry 3 --retry-all-errors \
            --output debian10.zip "$BOXEDWINE_BASE_FS"
          test -s Debian10-Wine-5.0.zip
          test -s debian10.zip
          file -b Debian10-Wine-5.0.zip | tee report/rootfs-wine-type.txt
          sha256sum Debian10-Wine-5.0.zip | tee report/rootfs-wine-sha256.txt
          file -b debian10.zip | tee report/rootfs-base-type.txt
          sha256sum debian10.zip | tee report/rootfs-base-sha256.txt
          unzip -tq Debian10-Wine-5.0.zip | tee report/rootfs-wine-test.txt
          unzip -tq debian10.zip | tee report/rootfs-base-test.txt

      - name: Recover genuine HOTD demo ephemerally from historical cover CD
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hotd-smoke"
          mkdir -p outer cdroot installer-inner
          curl --fail --location --retry 3 --retry-all-errors \
            --output cdzone67.rar "$PCZONE_CD_ARCHIVE"
          unar -f -o outer cdzone67.rar >/dev/null
          IMG="$(find outer -type f -iname '*.img' -print -quit)"
          test -n "$IMG"
          ccd2iso "$IMG" cdzone67.iso >/dev/null
          7z x -y -ocdroot cdzone67.iso >/dev/null
          INSTALLER="$(find cdroot -type f -ipath '*/Gamedemo/Win95/hotd/Install.exe' -print -quit)"
          test -n "$INSTALLER"
          ACTUAL_SHA="$(sha256sum "$INSTALLER" | awk '{print $1}')"
          echo "HOTD_INSTALLER_SHA256=$ACTUAL_SHA" | tee report/hotd-identity.txt
          test "$ACTUAL_SHA" = "$HOTD_INSTALLER_SHA256"
          7z x -y -oinstaller-inner "$INSTALLER" >/dev/null
          GAME_DIR="$(find installer-inner -type d -iname 'hotd_demo' -print -quit)"
          test -n "$GAME_DIR"
          test -f "$GAME_DIR/THOTDEMO.exe"
          test -f "$GAME_DIR/README.TXT"
          echo "GAME_EXE_SHA256=$(sha256sum "$GAME_DIR/THOTDEMO.exe" | awk '{print $1}')" | tee -a report/hotd-identity.txt
          echo "GAME_EXE_BYTES=$(stat -c %s "$GAME_DIR/THOTDEMO.exe")" | tee -a report/hotd-identity.txt
          printf '%s\n' "$GAME_DIR" > game-dir.txt

      - name: Launch THOTDEMO.exe under BoxedWine on Xvfb
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hotd-smoke"
          GAME_DIR="$(cat game-dir.txt)"
          BW="$GITHUB_WORKSPACE/Boxedwine/project/linux/Build/Release/boxedwine"
          mkdir -p boxedwine-write

          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp > report/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          sleep 2
          xdpyinfo > report/xdpyinfo.txt

          set +e
          "$BW" \
            -root "$PWD/boxedwine-write" \
            -zip "$PWD/debian10.zip" \
            -zip "$PWD/Debian10-Wine-5.0.zip" \
            -mount_drive "$GAME_DIR" d \
            -w /mnt/d_drive \
            -resolution 640x480 \
            -bpp 16 \
            -nosound \
            /bin/wine 'd:\\THOTDEMO.exe' \
            > report/boxedwine-hotd.log 2>&1 &
          GAME_PID=$!
          set -e

          sleep 20
          xwininfo -root -tree > report/window-tree.txt 2>&1 || true
          import -display :99 -window root report/hotd-xvfb.png 2> report/screenshot-error.txt || true

          if kill -0 "$GAME_PID" 2>/dev/null; then
            echo 'PROCESS_ALIVE_AFTER_20S=true' | tee report/smoke-status.env
            echo 'NATIVE_EXECUTION_SMOKE=PROCESS_SURVIVED' | tee -a report/smoke-status.env
            kill "$GAME_PID" 2>/dev/null || true
            sleep 1
            kill -9 "$GAME_PID" 2>/dev/null || true
          else
            set +e
            wait "$GAME_PID"
            EXIT_CODE=$?
            set -e
            echo 'PROCESS_ALIVE_AFTER_20S=false' | tee report/smoke-status.env
            echo "PROCESS_EXIT_CODE=$EXIT_CODE" | tee -a report/smoke-status.env
            echo 'NATIVE_EXECUTION_SMOKE=EARLY_EXIT' | tee -a report/smoke-status.env
          fi

          kill "$XVFB_PID" 2>/dev/null || true
          echo 'HOTD_BINARY_PERSISTED=NO' | tee -a report/smoke-status.env
          echo 'HOTD_BINARY_UPLOADED=NO' | tee -a report/smoke-status.env
          echo '--- WINDOW TREE ---'
          sed -n '1,160p' report/window-tree.txt || true
          echo '--- BOXEDWINE LOG TAIL ---'
          tail -n 160 report/boxedwine-hotd.log || true

      - name: Upload non-binary execution evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotd1997-native-boxedwine-smoke-report
          path: |
            ${{ runner.temp }}/hotd-smoke/report
            ${{ runner.temp }}/boxedwine-version.txt
          if-no-files-found: warn
          retention-days: 30
