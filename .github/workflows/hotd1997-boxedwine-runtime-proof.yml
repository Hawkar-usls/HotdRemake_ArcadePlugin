name: HOTD 1997 BoxedWine Runtime Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotd1997-boxedwine-runtime-proof.yml'

permissions:
  contents: read

jobs:
  boxedwine-host-runtime-isolation:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 50
    env:
      DEBIAN_FRONTEND: noninteractive
      BOXEDWINE_SOURCE_SHA: 5a2195ba47a169455c2dbe6bcb4bae4c256c9bad
      BOXEDWINE_OFFLINE_BUNDLE: https://sourceforge.net/projects/boxedwine/files/Builds/20.1.2/BoxedWine%2020.1.2%20-%20Windows.zip/download
      BOXEDWINE_OFFLINE_SHA256: 69bbc533af07aa39ffabbf49a04e9d0d6c275d0698aec8d5124fe0d3bc57b53e
      FULL_WINE17_URL: https://sourceforge.net/projects/boxedwine/files/FileSystems/Full/v5/Debian10-Wine-1.7.zip/download
      FULL_WINE50_URL: https://sourceforge.net/projects/boxedwine/files/FileSystems/Full/v5/Debian10-Wine-5.0.zip/download
      WINE17_SHA256: ceef9149e4607cad2001f365fed430c8c09845440d28bc25cc6914390640bf53
      WINE50_SHA256: 8fbe402c0c6b839e1f5db83414ac86a4a94c3e78b4a401caaf2a16e272e9747f
      DEBIAN10_SHA256: 722915350b7e3ea7da9fcfbd1faaf14a137dd979fe473257045dc9c902dedd0e
      PCZONE_CD_ARCHIVE: https://pixsoriginadventures.co.uk/PCZone/PC%20Zone%2067%20%28September%201998%29/CDZone%2367.rar
      PCZONE_RAR_SHA256: 1a8695d904886e028b4e14aa59b85934c1d867ed03d2f3a18c9d202691efa1ba
      HOTD_INSTALLER_SHA256: 6150da85cd5e7ba88bbe722aba8202d5f8726b66eb1e8614b2bda5e89ae76944
      HOTD_EXE_SHA256: 96951e783957858d20d181884ecd0566d53f91a88586345dc6fd126ca986d29f
    steps:
      - name: Install historical build, debugger and execution tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git curl unzip file cmake build-essential gdb \
            libsdl2-dev libssl-dev libminizip-dev libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri \
            xvfb x11-utils imagemagick unar p7zip-full ccd2iso
          gcc --version | head -n 1
          gdb --version | head -n 1

      - name: Checkout exact BoxedWine 20.1.2 source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lab" "$GITHUB_WORKSPACE/report"
          cd "$GITHUB_WORKSPACE/lab"
          git init -q Boxedwine
          cd Boxedwine
          git remote add origin https://github.com/danoon2/Boxedwine.git
          git fetch -q --depth=1 origin "$BOXEDWINE_SOURCE_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BOXEDWINE_SOURCE_SHA"
          git show -s --format='BOXEDWINE_SOURCE_SHA=%H%nBOXEDWINE_SOURCE_DATE=%cI%nBOXEDWINE_SOURCE_SUBJECT=%s' HEAD \
            | tee "$GITHUB_WORKSPACE/report/source-provenance.env"

      - name: Restore cached historical BoxedWine native build
        id: cache-bw
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/lab/Boxedwine/project/linux/bin
            ${{ github.workspace }}/lab/Boxedwine/project/linux/linux_build
          key: boxedwine-native-20.1.2-ubuntu20-${{ env.BOXEDWINE_SOURCE_SHA }}

      - name: Build historical native BoxedWine 20.1.2 when cache misses
        if: steps.cache-bw.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab/Boxedwine/project/linux"
          sh build64.sh > "$GITHUB_WORKSPACE/report/build64.log" 2>&1

      - name: Verify native runtime identity
        shell: bash
        run: |
          set -euo pipefail
          BW="$GITHUB_WORKSPACE/lab/Boxedwine/project/linux/bin/boxedwine64"
          test -x "$BW"
          file "$BW" | tee "$GITHUB_WORKSPACE/report/boxedwine-binary-type.txt"
          sha256sum "$BW" | tee "$GITHUB_WORKSPACE/report/boxedwine-native-sha256.txt"
          test "$(sha256sum "$BW" | awk '{print $1}')" = "99179e5bd1b9cbf224d7b82608ac13bc89fc889a2c861f9783971e1327f11f34"
          echo BOXEDWINE_NATIVE_BINARY_IDENTITY_PASS=true | tee "$GITHUB_WORKSPACE/report/boxedwine-native-identity.env"

      - name: Recover split and combined official filesystem roots
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          mkdir -p portable full-roots

          curl --fail --location --retry 3 --output boxedwine-offline.zip "$BOXEDWINE_OFFLINE_BUNDLE"
          test "$(sha256sum boxedwine-offline.zip | awk '{print $1}')" = "$BOXEDWINE_OFFLINE_SHA256"
          unzip -q boxedwine-offline.zip -d portable

          DEBIAN="$(find portable -type f -iname 'debian10.zip' -print -quit)"
          W17="$(find portable -type f -iname 'Wine-1.7.zip' -print -quit)"
          W50="$(find portable -type f -iname 'Wine-5.0.zip' -print -quit)"
          test -n "$DEBIAN" && test -n "$W17" && test -n "$W50"
          test "$(sha256sum "$DEBIAN" | awk '{print $1}')" = "$DEBIAN10_SHA256"
          test "$(sha256sum "$W17" | awk '{print $1}')" = "$WINE17_SHA256"
          test "$(sha256sum "$W50" | awk '{print $1}')" = "$WINE50_SHA256"
          printf '%s\n' "$DEBIAN" > debian.path
          printf '%s\n' "$W17" > split-wine17.path
          printf '%s\n' "$W50" > split-wine50.path

          curl --fail --location --retry 3 --output full-roots/Debian10-Wine-1.7.zip "$FULL_WINE17_URL"
          curl --fail --location --retry 3 --output full-roots/Debian10-Wine-5.0.zip "$FULL_WINE50_URL"
          file full-roots/*.zip | tee "$GITHUB_WORKSPACE/report/full-root-types.txt"
          unzip -tq full-roots/Debian10-Wine-1.7.zip >/dev/null
          unzip -tq full-roots/Debian10-Wine-5.0.zip >/dev/null
          sha256sum full-roots/*.zip | tee "$GITHUB_WORKSPACE/report/full-root-sha256.txt"
          stat -c '%n %s bytes' full-roots/*.zip | tee "$GITHUB_WORKSPACE/report/full-root-sizes.txt"
          echo OFFICIAL_ROOTS_FETCH_PASS=true | tee "$GITHUB_WORKSPACE/report/rootfs-fetch.env"

      - name: Start sterile Xvfb display
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp > "$GITHUB_WORKSPACE/report/xvfb.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/lab/xvfb.pid"
          sleep 2
          DISPLAY=:99 xdpyinfo > "$GITHUB_WORKSPACE/report/xdpyinfo.txt"

      - name: Baseline BoxedWine without HOTD
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          BW="$GITHUB_WORKSPACE/lab/Boxedwine/project/linux/bin/boxedwine64"
          DEBIAN="$(cat debian.path)"
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"

          : > "$REPORT/baseline.tsv"
          printf 'lane\tcommand\texit_code\tclassification\n' >> "$REPORT/baseline.tsv"

          run_probe() {
            local lane="$1"; shift
            local command_name="$1"; shift
            local log="$REPORT/baseline-${lane}-${command_name}.log"
            set +e
            timeout 20s "$@" > "$log" 2>&1
            local rc=$?
            set -e
            local class
            case "$rc" in
              0) class=PASS ;;
              124) class=TIMEOUT ;;
              139) class=HOST_SEGFAULT ;;
              *) class=FAIL ;;
            esac
            printf '%s\t%s\t%s\t%s\n' "$lane" "$command_name" "$rc" "$class" >> "$REPORT/baseline.tsv"
            echo "--- baseline $lane/$command_name rc=$rc class=$class ---"
            tail -n 80 "$log" || true
          }

          mkdir -p root-linux root-split17 root-split50 root-full17 root-full50

          run_probe debian-only ls-root \
            "$BW" -root root-linux -zip "$DEBIAN" -nosound /bin/ls /

          run_probe split17 wine-version \
            "$BW" -root root-split17 -zip "$DEBIAN" -zip "$(cat split-wine17.path)" -nosound /bin/wine --version

          run_probe split50 wine-version \
            "$BW" -root root-split50 -zip "$DEBIAN" -zip "$(cat split-wine50.path)" -nosound /bin/wine --version

          run_probe full17 wine-version \
            "$BW" -root root-full17 -zip full-roots/Debian10-Wine-1.7.zip -nosound /bin/wine --version

          run_probe full50 wine-version \
            "$BW" -root root-full50 -zip full-roots/Debian10-Wine-5.0.zip -nosound /bin/wine --version

          cat "$REPORT/baseline.tsv"

          if grep -q $'full17\twine-version\t0\tPASS' "$REPORT/baseline.tsv" || \
             grep -q $'full50\twine-version\t0\tPASS' "$REPORT/baseline.tsv"; then
            echo COMBINED_ROOT_WINE_BASELINE_PASS=true | tee "$REPORT/baseline-gate.env"
          else
            echo COMBINED_ROOT_WINE_BASELINE_PASS=false | tee "$REPORT/baseline-gate.env"
          fi

      - name: Capture native backtrace for first failing Wine baseline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          BW="$GITHUB_WORKSPACE/lab/Boxedwine/project/linux/bin/boxedwine64"
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"

          TARGET_LABEL=""
          ROOT=""
          ARGS=()
          if grep -q $'split17\twine-version\t139\tHOST_SEGFAULT' "$REPORT/baseline.tsv"; then
            TARGET_LABEL=split17
            ROOT=root-gdb-split17
            ARGS=(-zip "$(cat debian.path)" -zip "$(cat split-wine17.path)")
          elif grep -q $'full17\twine-version\t139\tHOST_SEGFAULT' "$REPORT/baseline.tsv"; then
            TARGET_LABEL=full17
            ROOT=root-gdb-full17
            ARGS=(-zip full-roots/Debian10-Wine-1.7.zip)
          elif grep -q $'full50\twine-version\t139\tHOST_SEGFAULT' "$REPORT/baseline.tsv"; then
            TARGET_LABEL=full50
            ROOT=root-gdb-full50
            ARGS=(-zip full-roots/Debian10-Wine-5.0.zip)
          else
            echo NO_HOST_SEGFAULT_BASELINE_TO_TRACE=true | tee "$REPORT/gdb-gate.env"
            exit 0
          fi

          mkdir -p "$ROOT"
          echo "GDB_TARGET=$TARGET_LABEL" | tee "$REPORT/gdb-gate.env"
          set +e
          timeout 35s gdb -q -batch \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex run \
            -ex 'info threads' \
            -ex 'thread apply all bt' \
            --args "$BW" -root "$ROOT" "${ARGS[@]}" -nosound /bin/wine --version \
            > "$REPORT/gdb-${TARGET_LABEL}.txt" 2>&1
          RC=$?
          set -e
          echo "GDB_EXIT_CODE=$RC" | tee -a "$REPORT/gdb-gate.env"
          sed -n '1,260p' "$REPORT/gdb-${TARGET_LABEL}.txt" || true

      - name: Recover genuine SEGA HOTD demo only if a combined root baseline works
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          if ! grep -q 'COMBINED_ROOT_WINE_BASELINE_PASS=true' "$REPORT/baseline-gate.env" 2>/dev/null; then
            echo HOTD_EXECUTION_SKIPPED_REASON=HOST_RUNTIME_BASELINE_NOT_GREEN | tee "$REPORT/hotd-execution-gate.env"
            exit 0
          fi

          mkdir -p cd-outer cd-root installer-inner
          curl --fail --location --retry 3 --output cdzone67.rar "$PCZONE_CD_ARCHIVE"
          test "$(sha256sum cdzone67.rar | awk '{print $1}')" = "$PCZONE_RAR_SHA256"
          unar -f -o cd-outer cdzone67.rar >/dev/null
          IMG="$(find cd-outer -type f -iname '*.img' -print -quit)"
          test -n "$IMG"
          ccd2iso "$IMG" cdzone67.iso >/dev/null
          7z x -y -ocd-root cdzone67.iso >/dev/null
          INSTALLER="$(find cd-root -type f -ipath '*/Gamedemo/Win95/hotd/Install.exe' -print -quit)"
          test -n "$INSTALLER"
          test "$(sha256sum "$INSTALLER" | awk '{print $1}')" = "$HOTD_INSTALLER_SHA256"
          7z x -y -oinstaller-inner "$INSTALLER" >/dev/null
          GAME_DIR="$(find installer-inner -type d -iname 'hotd_demo' -print -quit)"
          GAME_EXE="$(find "$GAME_DIR" -maxdepth 1 -type f -iname 'THOTDEMO.exe' -print -quit)"
          test -n "$GAME_EXE"
          test "$(sha256sum "$GAME_EXE" | awk '{print $1}')" = "$HOTD_EXE_SHA256"
          printf '%s\n' "$GAME_DIR" > game-dir.path
          {
            echo PACKAGE_IDENTITY_PASS=true
            echo HOTD_BINARY_PERSISTED=NO
            echo HOTD_BINARY_UPLOADED=NO
          } | tee "$REPORT/hotd-identity.env"

      - name: Run HOTD only on green combined-root lanes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          BW="$GITHUB_WORKSPACE/lab/Boxedwine/project/linux/bin/boxedwine64"
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"

          if [[ ! -f game-dir.path ]]; then
            echo HOTD_NATIVE_PASS=false | tee -a "$REPORT/hotd-execution-gate.env"
            exit 0
          fi

          GAME_DIR="$(cat game-dir.path)"
          : > "$REPORT/hotd-combined.tsv"
          printf 'lane\texit_or_alive\tframe_delta\tcrash\tverdict\n' >> "$REPORT/hotd-combined.tsv"
          PASS_COUNT=0

          for lane in full17 full50; do
            if ! grep -q $'${lane}\twine-version\t0\tPASS' "$REPORT/baseline.tsv"; then
              # shell interpolation of the literal above is intentionally avoided below.
              if ! awk -F '\t' -v l="$lane" '$1==l && $2=="wine-version" && $3==0 && $4=="PASS" {ok=1} END{exit !ok}' "$REPORT/baseline.tsv"; then
                printf '%s\tSKIPPED\tNA\tNA\tBASELINE_FAIL\n' "$lane" >> "$REPORT/hotd-combined.tsv"
                continue
              fi
            fi

            if [[ "$lane" == full17 ]]; then
              FS=full-roots/Debian10-Wine-1.7.zip
            else
              FS=full-roots/Debian10-Wine-5.0.zip
            fi
            ROOT="root-hotd-$lane"
            LOG="$REPORT/hotd-$lane.log"
            FRAME1="$RUNNER_TEMP/hotd-$lane-1.png"
            FRAME2="$RUNNER_TEMP/hotd-$lane-2.png"
            rm -rf "$ROOT" "$FRAME1" "$FRAME2"
            mkdir -p "$ROOT"

            set +e
            "$BW" -root "$ROOT" -zip "$FS" \
              -mount_drive "$GAME_DIR" d -w /mnt/d_drive \
              -resolution 640x480 -bpp 16 -nosound -title "HOTD-$lane" \
              /bin/wine 'd:\\THOTDEMO.exe' > "$LOG" 2>&1 &
            PID=$!
            set -e
            sleep 8
            import -display :99 -window root "$FRAME1" 2>/dev/null || true
            sleep 12
            import -display :99 -window root "$FRAME2" 2>/dev/null || true

            if kill -0 "$PID" 2>/dev/null; then
              STATE=ALIVE
              RC=NA
            else
              set +e
              wait "$PID"
              RC=$?
              set -e
              STATE="EXIT_$RC"
            fi

            CRASH=false
            if [[ "$RC" == 139 ]] || grep -Eiq 'starting debugger|winedbg|assertion failed|double free|corruption|unhandled exception|segmentation fault|fatal signal|core dumped' "$LOG"; then
              CRASH=true
            fi

            DELTA=NA
            if [[ -s "$FRAME1" && -s "$FRAME2" ]]; then
              set +e
              D="$(compare -metric AE "$FRAME1" "$FRAME2" null: 2>&1)"
              set -e
              [[ "$D" =~ ^[0-9]+$ ]] && DELTA="$D"
            fi

            VERDICT=FAIL
            if [[ "$STATE" == ALIVE && "$CRASH" == false && "$DELTA" != NA && "$DELTA" -gt 0 ]]; then
              VERDICT=PASS
              PASS_COUNT=$((PASS_COUNT + 1))
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$lane" "$STATE" "$DELTA" "$CRASH" "$VERDICT" >> "$REPORT/hotd-combined.tsv"
            tail -n 100 "$LOG" || true
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
            rm -f "$FRAME1" "$FRAME2"
          done

          cat "$REPORT/hotd-combined.tsv"
          if [[ "$PASS_COUNT" -gt 0 ]]; then
            echo HOTD_NATIVE_PASS=true | tee -a "$REPORT/hotd-execution-gate.env"
          else
            echo HOTD_NATIVE_PASS=false | tee -a "$REPORT/hotd-execution-gate.env"
          fi

      - name: Classify host-runtime gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/report"
          {
            echo "BOXEDWINE_SOURCE_SHA=$BOXEDWINE_SOURCE_SHA"
            echo "KNOWN_UPSTREAM_ISSUE=Boxedwine#89_Ubuntu_Wine_Segmentation_Fault"
            if grep -q 'COMBINED_ROOT_WINE_BASELINE_PASS=true' "$REPORT/baseline-gate.env" 2>/dev/null; then
              echo "HOST_RUNTIME_GATE=PASS"
            elif grep -q 'HOST_SEGFAULT' "$REPORT/baseline.tsv" 2>/dev/null; then
              echo "HOST_RUNTIME_GATE=FAIL_HOST_SEGFAULT"
            else
              echo "HOST_RUNTIME_GATE=FAIL_OTHER"
            fi
          } | tee "$REPORT/final-gate.env"

      - name: Stop sterile Xvfb
        if: always()
        shell: bash
        run: |
          PID="$(cat "$GITHUB_WORKSPACE/lab/xvfb.pid" 2>/dev/null || true)"
          [[ -n "$PID" ]] && kill "$PID" 2>/dev/null || true

      - name: Upload text-only host isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotd1997-boxedwine-host-runtime-isolation-report
          path: ${{ github.workspace }}/report
          if-no-files-found: warn
          retention-days: 30
