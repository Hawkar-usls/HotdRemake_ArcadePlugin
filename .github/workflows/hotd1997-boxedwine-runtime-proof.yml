name: HOTD 1997 BoxedWine Runtime Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotd1997-boxedwine-runtime-proof.yml'

permissions:
  contents: read

jobs:
  hotd-exact-era-wasm-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BOXEDWINE_SOURCE_SHA: 5a2195ba47a169455c2dbe6bcb4bae4c256c9bad
      EMSCRIPTEN_VERSION: 2.0.8
      WINE17_ROOT_URL: https://sourceforge.net/projects/boxedwine/files/FileSystems/Full/v5/Debian10-Wine-1.7.zip/download
      WINE17_ROOT_SHA256: b331eaa21c035c55a81fe260777f129962d2d6b8fb47a6cec1258f3a56bc8b98
      PCZONE_CD_ARCHIVE: https://pixsoriginadventures.co.uk/PCZone/PC%20Zone%2067%20%28September%201998%29/CDZone%2367.rar
      PCZONE_RAR_SHA256: 1a8695d904886e028b4e14aa59b85934c1d867ed03d2f3a18c9d202691efa1ba
      HOTD_INSTALLER_SHA256: 6150da85cd5e7ba88bbe722aba8202d5f8726b66eb1e8614b2bda5e89ae76944
      HOTD_EXE_SHA256: 96951e783957858d20d181884ecd0566d53f91a88586345dc6fd126ca986d29f
    steps:
      - name: Install archive, browser and build helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git curl unzip zip file unar p7zip-full ccd2iso python3 imagemagick
          mkdir -p "$GITHUB_WORKSPACE/lab" "$GITHUB_WORKSPACE/report" "$GITHUB_WORKSPACE/site"

      - name: Checkout exact BoxedWine 20.1.2 source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          git init -q Boxedwine
          cd Boxedwine
          git remote add origin https://github.com/danoon2/Boxedwine.git
          git fetch -q --depth=1 origin "$BOXEDWINE_SOURCE_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BOXEDWINE_SOURCE_SHA"
          git show -s --format='BOXEDWINE_SOURCE_SHA=%H%nBOXEDWINE_SOURCE_DATE=%cI%nBOXEDWINE_SOURCE_SUBJECT=%s' HEAD \
            | tee "$GITHUB_WORKSPACE/report/source-provenance.env"

      - name: Setup exact-era Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache-2.0.8

      - name: Build exact-era normal plus softMMU Web runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab/Boxedwine/project/emscripten"
          emcc --version | head -n 3 | tee "$GITHUB_WORKSPACE/report/emcc-version.txt"

          # The historical script deliberately compiles normal CPU + softMMU,
          # matching the native lane that already launched HOTD successfully.
          sh buildjs.sh > "$GITHUB_WORKSPACE/report/wasm-build.log" 2>&1
          test -s boxedwine.html
          test -s boxedwine.js
          test -s boxedwine.wasm
          sha256sum boxedwine.html boxedwine.js boxedwine.wasm \
            | tee "$GITHUB_WORKSPACE/report/wasm-runtime-sha256.txt"
          {
            echo WASM_BUILD_PASS=true
            echo CPU_CORE=normal
            echo MMU=softmmu
            echo THREAD_MODEL=singleThreaded
            echo EMSCRIPTEN_VERSION="$EMSCRIPTEN_VERSION"
          } | tee "$GITHUB_WORKSPACE/report/wasm-build-gate.env"

      - name: Assemble open-source browser runtime shell
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/lab/Boxedwine/project/emscripten"
          SITE="$GITHUB_WORKSPACE/site"
          cp "$SRC/boxedwine.html" "$SRC/boxedwine.js" "$SRC/boxedwine.wasm" "$SITE/"
          cp "$SRC/boxedwine.css" "$SRC/boxedwine-shell.js" "$SRC/browserfs.boxedwine.js" "$SRC/jszip.min.js" "$SITE/"
          find "$SITE" -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort \
            > "$GITHUB_WORKSPACE/report/open-runtime-files.txt"

      - name: Fetch verified Wine 1.7 browser root
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/site"
          curl --fail --location --retry 3 --output Debian10-Wine-1.7.zip "$WINE17_ROOT_URL"
          ACTUAL="$(sha256sum Debian10-Wine-1.7.zip | awk '{print $1}')"
          test "$ACTUAL" = "$WINE17_ROOT_SHA256"
          unzip -tq Debian10-Wine-1.7.zip >/dev/null
          {
            echo WINE17_ROOT_SHA256="$ACTUAL"
            echo WINE17_ROOT_IDENTITY_PASS=true
          } | tee "$GITHUB_WORKSPACE/report/root-gate.env"

      - name: Recover verified SEGA HOTD demo only inside runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          mkdir -p cd-outer cd-root installer-inner
          curl --fail --location --retry 3 --output cdzone67.rar "$PCZONE_CD_ARCHIVE"
          test "$(sha256sum cdzone67.rar | awk '{print $1}')" = "$PCZONE_RAR_SHA256"
          unar -f -o cd-outer cdzone67.rar >/dev/null
          IMG="$(find cd-outer -type f -iname '*.img' -print -quit)"
          test -n "$IMG"
          ccd2iso "$IMG" cdzone67.iso >/dev/null
          7z x -y -ocd-root cdzone67.iso >/dev/null
          INSTALLER="$(find cd-root -type f -ipath '*/Gamedemo/Win95/hotd/Install.exe' -print -quit)"
          test -n "$INSTALLER"
          test "$(sha256sum "$INSTALLER" | awk '{print $1}')" = "$HOTD_INSTALLER_SHA256"
          7z x -y -oinstaller-inner "$INSTALLER" >/dev/null
          GAME_DIR="$(find installer-inner -type d -iname 'hotd_demo' -print -quit)"
          GAME_EXE="$(find "$GAME_DIR" -maxdepth 1 -type f -iname 'THOTDEMO.exe' -print -quit)"
          test -n "$GAME_EXE"
          test "$(sha256sum "$GAME_EXE" | awk '{print $1}')" = "$HOTD_EXE_SHA256"

          # App ZIP is deliberately ephemeral and is never uploaded as an artifact.
          cd "$GAME_DIR"
          zip -qr "$GITHUB_WORKSPACE/site/hotd.zip" .
          cd "$GITHUB_WORKSPACE/lab"
          {
            echo PACKAGE_IDENTITY_PASS=true
            echo HOTD_EXE_SHA256="$HOTD_EXE_SHA256"
            echo HOTD_APP_ZIP_EPHEMERAL=true
            echo HOTD_BINARY_PERSISTED=NO
            echo HOTD_BINARY_UPLOADED=NO
          } | tee "$GITHUB_WORKSPACE/report/hotd-identity.env"

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Serve sterile Web runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/site"
          python3 -m http.server 8000 --bind 127.0.0.1 > "$GITHUB_WORKSPACE/report/http-server.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/lab/http.pid"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/boxedwine.html >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Execute genuine HOTD inside Chromium WASM
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          cat > wasm-hotd-proof.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          (async () => {
            const reportDir = process.env.GITHUB_WORKSPACE + '/report';
            const temp = process.env.RUNNER_TEMP;
            const consoleLines = [];
            const pageErrors = [];
            const browser = await chromium.launch({
              headless: true,
              args: ['--disable-dev-shm-usage', '--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist']
            });
            const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
            page.on('console', msg => consoleLines.push(`[${msg.type()}] ${msg.text()}`));
            page.on('pageerror', err => pageErrors.push(String(err)));

            const url = 'http://127.0.0.1:8000/boxedwine.html' +
              '?root=Debian10-Wine-1.7&app=hotd&p=THOTDEMO.exe&work=d:/hotd&bpp=16&sound=false&auto=true';
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.screenshot({ path: temp + '/wasm-pre.png' });

            let canvasSeen = false;
            for (let i = 0; i < 60; i++) {
              const state = await page.evaluate(() => {
                const c = document.getElementById('canvas');
                return c ? { w: c.width, h: c.height } : null;
              }).catch(() => null);
              if (state && state.w >= 320 && state.h >= 200) { canvasSeen = true; break; }
              await page.waitForTimeout(1000);
            }

            await page.waitForTimeout(8000);
            await page.screenshot({ path: temp + '/wasm-frame1.png' });
            await page.keyboard.press('Enter').catch(() => {});
            await page.mouse.move(512, 384).catch(() => {});
            await page.mouse.click(512, 384).catch(() => {});
            await page.waitForTimeout(10000);
            await page.screenshot({ path: temp + '/wasm-frame2.png' });

            fs.writeFileSync(reportDir + '/browser-console.log', consoleLines.join('\n') + '\n');
            fs.writeFileSync(reportDir + '/browser-page-errors.log', pageErrors.join('\n') + '\n');

            function delta(a, b) {
              try {
                const out = execFileSync('compare', ['-metric', 'AE', a, b, 'null:'], { encoding: 'utf8', stdio: ['ignore','pipe','pipe'] });
                const v = String(out || '').trim();
                return /^\d+$/.test(v) ? Number(v) : 0;
              } catch (e) {
                const v = String((e.stderr || e.stdout || '')).trim();
                return /^\d+$/.test(v) ? Number(v) : 0;
              }
            }

            const visualDelta = delta(temp + '/wasm-pre.png', temp + '/wasm-frame1.png');
            const motionDelta = delta(temp + '/wasm-frame1.png', temp + '/wasm-frame2.png');
            const text = consoleLines.join('\n');
            const errorText = pageErrors.join('\n');
            const launchLog = /Launching .*THOTDEMO\.exe/i.test(text);
            const crash = /(abort\(|RuntimeError|unhandled exception|segmentation fault|assertion failed|double free|corruption)/i.test(text + '\n' + errorText);
            const launchPass = canvasSeen && visualDelta > 0 && !crash;
            const motionPass = launchPass && motionDelta > 0;

            const rows = [
              `CANVAS_SEEN=${canvasSeen}`,
              `THOTDEMO_LAUNCH_LOG_SEEN=${launchLog}`,
              `PAGE_ERROR_COUNT=${pageErrors.length}`,
              `CRASH_SIGNATURE=${crash}`,
              `VISUAL_DELTA_FROM_PRE=${visualDelta}`,
              `MOTION_DELTA_AFTER_INPUT=${motionDelta}`,
              `BOXEDWINE_WASM_HOTD_LAUNCH_PASS=${launchPass}`,
              `BOXEDWINE_WASM_HOTD_MOTION_PASS=${motionPass}`
            ];
            fs.writeFileSync(reportDir + '/wasm-hotd-gate.env', rows.join('\n') + '\n');
            console.log(rows.join('\n'));

            await browser.close();
            for (const f of ['wasm-pre.png','wasm-frame1.png','wasm-frame2.png']) {
              try { fs.unlinkSync(temp + '/' + f); } catch (_) {}
            }
            process.exit(launchPass ? 0 : 2);
          })().catch(err => { console.error(err); process.exit(3); });
          NODE

          set +e
          node wasm-hotd-proof.js | tee "$GITHUB_WORKSPACE/report/wasm-hotd-proof.stdout.txt"
          RC=${PIPESTATUS[0]}
          set -e
          echo "BROWSER_PROOF_EXIT_CODE=$RC" | tee -a "$GITHUB_WORKSPACE/report/wasm-hotd-gate.env"

          # SEGA bytes and transient browser captures must never reach artifacts.
          rm -f "$GITHUB_WORKSPACE/site/hotd.zip"
          rm -f "$RUNNER_TEMP/wasm-pre.png" "$RUNNER_TEMP/wasm-frame1.png" "$RUNNER_TEMP/wasm-frame2.png"
          if [[ "$RC" -eq 0 ]]; then
            echo WASM_GATE_RESULT=PASS | tee -a "$GITHUB_WORKSPACE/report/wasm-hotd-gate.env"
          else
            echo WASM_GATE_RESULT=FAIL | tee -a "$GITHUB_WORKSPACE/report/wasm-hotd-gate.env"
          fi

      - name: Stop sterile HTTP server
        if: always()
        shell: bash
        run: |
          PID="$(cat "$GITHUB_WORKSPACE/lab/http.pid" 2>/dev/null || true)"
          [[ -n "$PID" ]] && kill "$PID" 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/site/hotd.zip"

      - name: Upload text-only WASM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotd1997-exact-era-wasm-report
          path: ${{ github.workspace }}/report
          if-no-files-found: warn
          retention-days: 30
