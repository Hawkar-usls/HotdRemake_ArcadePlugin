name: HOTD 1997 BoxedWine Runtime Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotd1997-boxedwine-runtime-proof.yml'

permissions:
  contents: read

jobs:
  hotd-normal-core-web-aligned-proof:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 50
    env:
      DEBIAN_FRONTEND: noninteractive
      BOXEDWINE_SOURCE_SHA: 5a2195ba47a169455c2dbe6bcb4bae4c256c9bad
      FULL_WINE17_URL: https://sourceforge.net/projects/boxedwine/files/FileSystems/Full/v5/Debian10-Wine-1.7.zip/download
      FULL_WINE50_URL: https://sourceforge.net/projects/boxedwine/files/FileSystems/Full/v5/Debian10-Wine-5.0.zip/download
      PCZONE_CD_ARCHIVE: https://pixsoriginadventures.co.uk/PCZone/PC%20Zone%2067%20%28September%201998%29/CDZone%2367.rar
      PCZONE_RAR_SHA256: 1a8695d904886e028b4e14aa59b85934c1d867ed03d2f3a18c9d202691efa1ba
      HOTD_INSTALLER_SHA256: 6150da85cd5e7ba88bbe722aba8202d5f8726b66eb1e8614b2bda5e89ae76944
      HOTD_EXE_SHA256: 96951e783957858d20d181884ecd0566d53f91a88586345dc6fd126ca986d29f
    steps:
      - name: Install historical normal-core build and sterile execution tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git curl unzip file cmake build-essential gdb \
            libsdl2-dev libssl-dev libminizip-dev libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri \
            xvfb x11-utils imagemagick unar p7zip-full ccd2iso

      - name: Checkout exact BoxedWine 20.1.2 source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lab" "$GITHUB_WORKSPACE/report"
          cd "$GITHUB_WORKSPACE/lab"
          git init -q Boxedwine
          cd Boxedwine
          git remote add origin https://github.com/danoon2/Boxedwine.git
          git fetch -q --depth=1 origin "$BOXEDWINE_SOURCE_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BOXEDWINE_SOURCE_SHA"
          git show -s --format='BOXEDWINE_SOURCE_SHA=%H%nBOXEDWINE_SOURCE_DATE=%cI%nBOXEDWINE_SOURCE_SUBJECT=%s' HEAD \
            | tee "$GITHUB_WORKSPACE/report/source-provenance.env"

      - name: Build Web-aligned normal CPU plus softMMU runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab/Boxedwine/project/linux"
          sh build.sh > "$GITHUB_WORKSPACE/report/build-normal.log" 2>&1
          test -x bin/boxedwine
          file bin/boxedwine | tee "$GITHUB_WORKSPACE/report/boxedwine-normal-type.txt"
          sha256sum bin/boxedwine | tee "$GITHUB_WORKSPACE/report/boxedwine-normal-sha256.txt"
          {
            echo CPU_CORE=normal
            echo MMU=softmmu
            echo THREAD_MODEL=singleThreaded
            echo WEB_EXECUTION_CORE_ALIGNMENT=normal_plus_softmmu
          } | tee "$GITHUB_WORKSPACE/report/normal-core-contract.env"

      - name: Fetch official combined 20.1.2-era full roots
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          mkdir -p full-roots
          curl --fail --location --retry 3 --output full-roots/Debian10-Wine-1.7.zip "$FULL_WINE17_URL"
          curl --fail --location --retry 3 --output full-roots/Debian10-Wine-5.0.zip "$FULL_WINE50_URL"
          unzip -tq full-roots/Debian10-Wine-1.7.zip >/dev/null
          unzip -tq full-roots/Debian10-Wine-5.0.zip >/dev/null
          file full-roots/*.zip | tee "$GITHUB_WORKSPACE/report/full-root-types.txt"
          sha256sum full-roots/*.zip | tee "$GITHUB_WORKSPACE/report/full-root-sha256.txt"
          stat -c '%n %s bytes' full-roots/*.zip | tee "$GITHUB_WORKSPACE/report/full-root-sizes.txt"
          echo FULL_ROOT_FETCH_AND_INTEGRITY_PASS=true | tee "$GITHUB_WORKSPACE/report/full-root-gate.env"

      - name: Start sterile Xvfb display
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp > "$GITHUB_WORKSPACE/report/xvfb.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/lab/xvfb.pid"
          sleep 2
          DISPLAY=:99 xdpyinfo > "$GITHUB_WORKSPACE/report/xdpyinfo.txt"

      - name: Prove normal core can execute Linux and Wine before HOTD
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          BW="$GITHUB_WORKSPACE/lab/Boxedwine/project/linux/bin/boxedwine"
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"

          : > "$REPORT/normal-baseline.tsv"
          printf 'lane\tcommand\texit_code\tclassification\n' >> "$REPORT/normal-baseline.tsv"

          probe() {
            local lane="$1"; shift
            local cmd="$1"; shift
            local log="$REPORT/normal-${lane}-${cmd}.log"
            set +e
            timeout 25s "$@" > "$log" 2>&1
            local rc=$?
            set -e
            local class=FAIL
            [[ "$rc" -eq 0 ]] && class=PASS
            [[ "$rc" -eq 124 ]] && class=TIMEOUT
            [[ "$rc" -eq 139 ]] && class=HOST_SEGFAULT
            printf '%s\t%s\t%s\t%s\n' "$lane" "$cmd" "$rc" "$class" >> "$REPORT/normal-baseline.tsv"
            echo "--- $lane/$cmd rc=$rc class=$class ---"
            tail -n 80 "$log" || true
          }

          mkdir -p root17 root50
          probe full17 wine-version \
            "$BW" -root root17 -zip full-roots/Debian10-Wine-1.7.zip -nosound /bin/wine --version
          probe full50 wine-version \
            "$BW" -root root50 -zip full-roots/Debian10-Wine-5.0.zip -nosound /bin/wine --version
          cat "$REPORT/normal-baseline.tsv"

          PASS_COUNT="$(awk -F '\t' '$2=="wine-version" && $3==0 && $4=="PASS" {n++} END{print n+0}' "$REPORT/normal-baseline.tsv")"
          {
            echo NORMAL_WINE_BASELINE_PASS_COUNT="$PASS_COUNT"
            if [[ "$PASS_COUNT" -gt 0 ]]; then
              echo NORMAL_HOST_RUNTIME_GATE=PASS
            elif grep -q HOST_SEGFAULT "$REPORT/normal-baseline.tsv"; then
              echo NORMAL_HOST_RUNTIME_GATE=FAIL_HOST_SEGFAULT
            else
              echo NORMAL_HOST_RUNTIME_GATE=FAIL_OTHER
            fi
          } | tee "$REPORT/normal-host-gate.env"

      - name: Capture normal-core backtrace if baseline still segfaults
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          BW="$GITHUB_WORKSPACE/lab/Boxedwine/project/linux/bin/boxedwine"
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"

          if ! grep -q HOST_SEGFAULT "$REPORT/normal-baseline.tsv" 2>/dev/null; then
            echo NORMAL_GDB_SKIPPED_NO_HOST_SEGFAULT=true | tee "$REPORT/normal-gdb-gate.env"
            exit 0
          fi
          LANE=full17
          FS=full-roots/Debian10-Wine-1.7.zip
          if ! awk -F '\t' '$1=="full17" && $4=="HOST_SEGFAULT" {ok=1} END{exit !ok}' "$REPORT/normal-baseline.tsv"; then
            LANE=full50
            FS=full-roots/Debian10-Wine-5.0.zip
          fi
          mkdir -p root-gdb-normal
          echo "GDB_TARGET=$LANE" | tee "$REPORT/normal-gdb-gate.env"
          set +e
          timeout 35s gdb -q -batch \
            -ex 'set pagination off' -ex 'set confirm off' -ex run \
            -ex 'info threads' -ex 'thread apply all bt' \
            --args "$BW" -root root-gdb-normal -zip "$FS" -nosound /bin/wine --version \
            > "$REPORT/normal-gdb-${LANE}.txt" 2>&1
          RC=$?
          set -e
          echo "GDB_EXIT_CODE=$RC" | tee -a "$REPORT/normal-gdb-gate.env"
          sed -n '1,260p' "$REPORT/normal-gdb-${LANE}.txt" || true

      - name: Recover genuine SEGA demo only after normal Wine baseline passes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          if ! grep -q 'NORMAL_HOST_RUNTIME_GATE=PASS' "$REPORT/normal-host-gate.env" 2>/dev/null; then
            echo HOTD_NORMAL_EXECUTION_SKIPPED_REASON=NORMAL_HOST_BASELINE_NOT_GREEN | tee "$REPORT/hotd-normal-gate.env"
            exit 0
          fi

          mkdir -p cd-outer cd-root installer-inner
          curl --fail --location --retry 3 --output cdzone67.rar "$PCZONE_CD_ARCHIVE"
          test "$(sha256sum cdzone67.rar | awk '{print $1}')" = "$PCZONE_RAR_SHA256"
          unar -f -o cd-outer cdzone67.rar >/dev/null
          IMG="$(find cd-outer -type f -iname '*.img' -print -quit)"
          ccd2iso "$IMG" cdzone67.iso >/dev/null
          7z x -y -ocd-root cdzone67.iso >/dev/null
          INSTALLER="$(find cd-root -type f -ipath '*/Gamedemo/Win95/hotd/Install.exe' -print -quit)"
          test -n "$INSTALLER"
          test "$(sha256sum "$INSTALLER" | awk '{print $1}')" = "$HOTD_INSTALLER_SHA256"
          7z x -y -oinstaller-inner "$INSTALLER" >/dev/null
          GAME_DIR="$(find installer-inner -type d -iname 'hotd_demo' -print -quit)"
          GAME_EXE="$(find "$GAME_DIR" -maxdepth 1 -type f -iname 'THOTDEMO.exe' -print -quit)"
          test -n "$GAME_EXE"
          test "$(sha256sum "$GAME_EXE" | awk '{print $1}')" = "$HOTD_EXE_SHA256"
          printf '%s\n' "$GAME_DIR" > game-dir.path
          {
            echo PACKAGE_IDENTITY_PASS=true
            echo HOTD_EXE_SHA256="$HOTD_EXE_SHA256"
            echo HOTD_BINARY_PERSISTED=NO
            echo HOTD_BINARY_UPLOADED=NO
          } | tee "$REPORT/hotd-normal-identity.env"

      - name: Run strict HOTD normal-core full-root matrix
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/lab"
          REPORT="$GITHUB_WORKSPACE/report"
          BW="$GITHUB_WORKSPACE/lab/Boxedwine/project/linux/bin/boxedwine"
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"

          : > "$REPORT/hotd-normal.tsv"
          printf 'lane\tstate\tframe_delta\tcrash\tverdict\n' >> "$REPORT/hotd-normal.tsv"
          if [[ ! -f game-dir.path ]]; then
            echo HOTD_NORMAL_NATIVE_PASS=false | tee -a "$REPORT/hotd-normal-gate.env"
            exit 0
          fi
          GAME_DIR="$(cat game-dir.path)"
          PASS_COUNT=0

          for lane in full17 full50; do
            if ! awk -F '\t' -v l="$lane" '$1==l && $2=="wine-version" && $3==0 && $4=="PASS" {ok=1} END{exit !ok}' "$REPORT/normal-baseline.tsv"; then
              printf '%s\tSKIPPED\tNA\tNA\tBASELINE_FAIL\n' "$lane" >> "$REPORT/hotd-normal.tsv"
              continue
            fi
            [[ "$lane" == full17 ]] && FS=full-roots/Debian10-Wine-1.7.zip || FS=full-roots/Debian10-Wine-5.0.zip
            ROOT="root-hotd-normal-$lane"
            LOG="$REPORT/hotd-normal-$lane.log"
            F1="$RUNNER_TEMP/$lane-normal-1.png"
            F2="$RUNNER_TEMP/$lane-normal-2.png"
            rm -rf "$ROOT" "$F1" "$F2"
            mkdir -p "$ROOT"

            set +e
            "$BW" -root "$ROOT" -zip "$FS" \
              -mount_drive "$GAME_DIR" d -w /mnt/d_drive \
              -resolution 640x480 -bpp 16 -nosound -title "HOTD-normal-$lane" \
              /bin/wine 'd:\\THOTDEMO.exe' > "$LOG" 2>&1 &
            PID=$!
            set -e
            sleep 10
            import -display :99 -window root "$F1" 2>/dev/null || true
            sleep 15
            import -display :99 -window root "$F2" 2>/dev/null || true

            RC=NA
            if kill -0 "$PID" 2>/dev/null; then
              STATE=ALIVE
            else
              set +e
              wait "$PID"; RC=$?
              set -e
              STATE="EXIT_$RC"
            fi
            CRASH=false
            if [[ "$RC" == 139 ]] || grep -Eiq 'starting debugger|winedbg|assertion failed|double free|corruption|unhandled exception|segmentation fault|fatal signal|core dumped' "$LOG"; then
              CRASH=true
            fi
            DELTA=NA
            if [[ -s "$F1" && -s "$F2" ]]; then
              set +e
              D="$(compare -metric AE "$F1" "$F2" null: 2>&1)"
              set -e
              [[ "$D" =~ ^[0-9]+$ ]] && DELTA="$D"
            fi
            VERDICT=FAIL
            if [[ "$STATE" == ALIVE && "$CRASH" == false && "$DELTA" != NA && "$DELTA" -gt 0 ]]; then
              VERDICT=PASS
              PASS_COUNT=$((PASS_COUNT + 1))
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$lane" "$STATE" "$DELTA" "$CRASH" "$VERDICT" >> "$REPORT/hotd-normal.tsv"
            tail -n 120 "$LOG" || true
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
            rm -f "$F1" "$F2"
          done
          cat "$REPORT/hotd-normal.tsv"
          if [[ "$PASS_COUNT" -gt 0 ]]; then
            echo HOTD_NORMAL_NATIVE_PASS=true | tee -a "$REPORT/hotd-normal-gate.env"
          else
            echo HOTD_NORMAL_NATIVE_PASS=false | tee -a "$REPORT/hotd-normal-gate.env"
          fi

      - name: Stop sterile Xvfb
        if: always()
        shell: bash
        run: |
          PID="$(cat "$GITHUB_WORKSPACE/lab/xvfb.pid" 2>/dev/null || true)"
          [[ -n "$PID" ]] && kill "$PID" 2>/dev/null || true

      - name: Upload text-only normal-core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotd1997-boxedwine-normal-web-aligned-report
          path: ${{ github.workspace }}/report
          if-no-files-found: warn
          retention-days: 30
