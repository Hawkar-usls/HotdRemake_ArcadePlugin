name: HOTD 1997 Official 26R1 Wine6 Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotd1997-modern-boxedwine-proof.yml'

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BOXEDWINE_WEB_BASE: https://boxedwine.org/v/26R1/wine6/st
      PCZONE_CD_ARCHIVE: https://pixsoriginadventures.co.uk/PCZone/PC%20Zone%2067%20%28September%201998%29/CDZone%2367.rar
      PCZONE_RAR_SHA256: 1a8695d904886e028b4e14aa59b85934c1d867ed03d2f3a18c9d202691efa1ba
      HOTD_INSTALLER_SHA256: 6150da85cd5e7ba88bbe722aba8202d5f8726b66eb1e8614b2bda5e89ae76944
    steps:
      - name: Install helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip zip unar p7zip-full ccd2iso python3 imagemagick
          mkdir -p lab site report

      - name: Fetch official BoxedWine 26R1 Wine6 single-threaded web stack
        shell: bash
        run: |
          set -euo pipefail
          cd site
          curl --fail --location --retry 3 -o boxedwine.html "$BOXEDWINE_WEB_BASE/boxedwine.html"
          curl --fail --location --retry 3 -o boxedwine.zip "$BOXEDWINE_WEB_BASE/boxedwine.zip"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('boxedwine.html').read_text(errors='replace')
          refs=[]
          for pat in (r'<script[^>]+src=["\']([^"\']+)', r'<link[^>]+href=["\']([^"\']+)'):
              refs += re.findall(pat,s,re.I)
          refs += ['boxedwine.js','boxedwine.wasm']
          keep=[]
          for x in refs:
              x=x.split('?',1)[0]
              if not x or '://' in x or x.startswith('/') or x.startswith('data:'): continue
              if x not in keep: keep.append(x)
          Path('../lab/assets.txt').write_text('\n'.join(keep)+'\n')
          PY
          while IFS= read -r f; do
            mkdir -p "$(dirname "$f")"
            curl --fail --location --retry 3 -o "$f" "$BOXEDWINE_WEB_BASE/$f"
          done < ../lab/assets.txt
          unzip -tq boxedwine.zip >/dev/null
          printf 'OFFICIAL_RELEASE=26R1\nWINE_LINE=6\nTHREADING=single\nRUNTIME_FETCH_PASS=true\n' > ../report/runtime.env

      - name: Reconstruct HOTD demo ephemerally for smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd lab
          mkdir -p cd-outer cd-root installer-inner
          curl --fail --location --retry 3 -o cdzone67.rar "$PCZONE_CD_ARCHIVE"
          test "$(sha256sum cdzone67.rar | awk '{print $1}')" = "$PCZONE_RAR_SHA256"
          unar -f -o cd-outer cdzone67.rar >/dev/null
          IMG="$(find cd-outer -type f -iname '*.img' -print -quit)"
          test -n "$IMG"
          ccd2iso "$IMG" cdzone67.iso >/dev/null
          7z x -y -ocd-root cdzone67.iso >/dev/null
          INSTALLER="$(find cd-root -type f -ipath '*/Gamedemo/Win95/hotd/Install.exe' -print -quit)"
          test -n "$INSTALLER"
          test "$(sha256sum "$INSTALLER" | awk '{print $1}')" = "$HOTD_INSTALLER_SHA256"
          7z x -y -oinstaller-inner "$INSTALLER" >/dev/null
          GAME_DIR="$(find installer-inner -type d -iname hotd_demo -print -quit)"
          test -f "$GAME_DIR/THOTDEMO.exe"
          test -f "$GAME_DIR/RUNDEMO.EXE" || test -f "$GAME_DIR/rundemo.exe"
          (cd "$GAME_DIR" && zip -qr "$GITHUB_WORKSPACE/site/hotd.zip" .)
          printf 'PACKAGE_IDENTITY_PASS=true\nHOTD_BINARY_PERSISTED=NO\nHOTD_BINARY_UPLOADED=NO\nPUBLIC_GAME_BODY_DEPLOYED=NO\n' > "$GITHUB_WORKSPACE/report/package.env"

      - name: Install Chromium
        shell: bash
        run: |
          cd lab
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Serve temporary smoke-test site
        shell: bash
        run: |
          cd site
          python3 -m http.server 8000 --bind 127.0.0.1 > ../report/http.log 2>&1 &
          echo $! > ../lab/http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/boxedwine.html >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Measure runtime activity, not human playability
        shell: bash
        run: |
          set -euo pipefail
          cd lab
          cat > smoke.js <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          function delta(a,b){
            try { execFileSync('compare',['-metric','AE',a,b,'null:'],{stdio:['ignore','pipe','pipe']}); return 0; }
            catch(e){ const v=String(e.stderr||'').trim(); return /^\d+$/.test(v)?Number(v):0; }
          }
          async function lane(browser, program, key){
            const out=process.env.GITHUB_WORKSPACE+'/report', tmp=process.env.RUNNER_TEMP, logs=[], errs=[];
            const page=await browser.newPage({viewport:{width:1024,height:768}});
            page.on('console',m=>logs.push(`[${m.type()}] ${m.text()}`));
            page.on('pageerror',e=>errs.push(String(e)));
            const url=`http://127.0.0.1:8000/boxedwine.html?app=hotd&p=${encodeURIComponent(program)}&resolution=640x480&bpp=16&sound=false&auto=true&disableHideCursor=true`;
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.screenshot({path:`${tmp}/${key}-0.png`});
            await page.waitForTimeout(18000);
            await page.screenshot({path:`${tmp}/${key}-1.png`});
            for (const k of ['Enter','Space','1','5']) await page.keyboard.press(k).catch(()=>{});
            await page.mouse.move(320,240).catch(()=>{});
            await page.mouse.click(320,240).catch(()=>{});
            await page.waitForTimeout(12000);
            await page.screenshot({path:`${tmp}/${key}-2.png`});
            const boot=delta(`${tmp}/${key}-0.png`,`${tmp}/${key}-1.png`);
            const activity=delta(`${tmp}/${key}-1.png`,`${tmp}/${key}-2.png`);
            const text=logs.join('\n')+'\n'+errs.join('\n');
            const crash=/(starting debugger|wine debugger|winedbg|unhandled page fault|unhandled exception|assertion failed|double free|corruption|segmentation fault|setjmp is required|unimplemented function|failed to initialize|abort\(|RuntimeError|Internal crash)/i.test(text);
            const launch=/Launching .*wine/i.test(text);
            const smoke=errs.length===0&&!crash&&launch&&boot>0&&activity>0;
            fs.writeFileSync(`${out}/${key}-gate.env`,[`PROGRAM=${program}`,`PAGE_ERROR_COUNT=${errs.length}`,`LAUNCH_LOG=${launch}`,`CRASH_SIGNATURE=${crash}`,`BOOT_DELTA=${boot}`,`POST_INPUT_FRAME_DELTA=${activity}`,`RUNTIME_SMOKE_PASS=${smoke}`,`HUMAN_PLAYABILITY_PROVEN=false`].join('\n')+'\n');
            await page.close();
            for(const n of [0,1,2]) try{fs.unlinkSync(`${tmp}/${key}-${n}.png`)}catch(_){}
            return smoke;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--disable-dev-shm-usage','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
            const a=await lane(browser,'RUNDEMO.EXE','rundemo');
            const b=await lane(browser,'THOTDEMO.exe','thotdemo');
            await browser.close();
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/report/final.env',`RUNDEMO_RUNTIME_SMOKE_PASS=${a}\nTHOTDEMO_RUNTIME_SMOKE_PASS=${b}\nANY_RUNTIME_SMOKE_PASS=${a||b}\nPUBLIC_PLAYABLE_PASS=false\n`);
            process.exit(a||b?0:2);
          })().catch(e=>{console.error(e);process.exit(3)});
          NODE
          set +e
          node smoke.js
          RC=$?
          set -e
          rm -f ../site/hotd.zip
          echo SMOKE_EXIT_CODE=$RC >> ../report/final.env
          test "$RC" -eq 0

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          kill "$(cat lab/http.pid 2>/dev/null)" 2>/dev/null || true
          rm -f site/hotd.zip

      - name: Upload text-only smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotd1997-runtime-smoke-report
          path: report
          retention-days: 30
