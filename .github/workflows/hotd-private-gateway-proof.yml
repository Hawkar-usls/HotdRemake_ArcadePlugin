name: HOTD 1997 Private Gateway Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'real-hotd.html'
      - 'real-hotd-personal.js'
      - 'hotd-boxedwine-bridge.js'
      - 'vendor/boxedwine26r1/**'
      - '.github/workflows/hotd-private-gateway-proof.yml'

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAYLOAD_ARTIFACT_ID: '9815109008'
      HOTD_ZIP_SHA256: 5421733293af7a57d5b7f3c4e4d53d52109c47be7b888f4b0308feb15f9ccfe6
      HOTD_ZIP_BYTES: '16078013'
    steps:
      - uses: actions/checkout@v4

      - name: Install browser helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip imagemagick
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p lab report

      - name: Recover exact verified user payload artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PAYLOAD_ARTIFACT_ID/zip" \
            -o lab/payload-artifact.zip
          mkdir -p lab/payload
          unzip -q lab/payload-artifact.zip -d lab/payload
          PAYLOAD="$(find lab/payload -type f -name hotd.zip -print -quit)"
          test -n "$PAYLOAD"
          test "$(stat -c %s "$PAYLOAD")" = "$HOTD_ZIP_BYTES"
          test "$(sha256sum "$PAYLOAD" | awk '{print $1}')" = "$HOTD_ZIP_SHA256"
          cp "$PAYLOAD" ./hotd.zip
          printf 'PAYLOAD_SOURCE=verified-actions-artifact\nPAYLOAD_BYTES=%s\nPAYLOAD_SHA256=%s\n' "$HOTD_ZIP_BYTES" "$HOTD_ZIP_SHA256" > report/payload.env

      - name: Serve checkout temporarily
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > report/http.log 2>&1 &
          echo $! > lab/http.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/real-hotd.html >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Prove cache to bridge to Wine launch
        shell: bash
        run: |
          set -euo pipefail
          cat > lab/proof.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          function delta(a,b) {
            try {
              execFileSync('compare',['-metric','AE',a,b,'null:'],{stdio:['ignore','pipe','pipe']});
              return 0;
            } catch(e) {
              const v=String(e.stderr||'').trim();
              return /^\d+$/.test(v)?Number(v):0;
            }
          }

          (async()=>{
            const browser=await chromium.launch({
              headless:true,
              args:['--disable-dev-shm-usage','--enable-webgl','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']
            });
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const logs=[], errors=[];
            page.on('console',m=>logs.push(`[${m.type()}] ${m.text()}`));
            page.on('pageerror',e=>errors.push(String(e)));

            // Seed the exact private payload into the same-origin browser cache.
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded'});
            await page.evaluate(async()=>{
              const response=await fetch('/hotd.zip',{cache:'no-store'});
              if(!response.ok) throw new Error(`seed fetch ${response.status}`);
              const buffer=await response.arrayBuffer();
              await new Promise((resolve,reject)=>{
                const req=indexedDB.open('hotd-private-cache-v1',1);
                req.onupgradeneeded=()=>{
                  if(!req.result.objectStoreNames.contains('payloads')) req.result.createObjectStore('payloads');
                };
                req.onerror=()=>reject(req.error);
                req.onsuccess=()=>{
                  const db=req.result;
                  const tx=db.transaction('payloads','readwrite');
                  tx.objectStore('payloads').put({
                    buffer,
                    bytes:16078013,
                    sha256:'5421733293af7a57d5b7f3c4e4d53d52109c47be7b888f4b0308feb15f9ccfe6',
                    savedAt:Date.now()
                  },'hotd.zip');
                  tx.oncomplete=()=>{db.close();resolve();};
                  tx.onerror=()=>reject(tx.error);
                };
              });
            });

            // Critical: remove the payload from the web root before the actual launch.
            fs.unlinkSync('hotd.zip');

            await page.goto('http://127.0.0.1:8000/real-hotd.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(5000);
            await page.screenshot({path:'lab/g0.png'});
            await page.waitForTimeout(25000);
            await page.screenshot({path:'lab/g1.png'});

            const frame=page.frames().find(f=>f.url().includes('boxedwine.html'));
            if(frame) {
              for(const key of ['Enter','Space','1','5']) await frame.locator('body').press(key).catch(()=>{});
              await frame.locator('canvas').click({position:{x:320,y:240}}).catch(()=>{});
            }
            await page.waitForTimeout(12000);
            await page.screenshot({path:'lab/g2.png'});

            const boot=delta('lab/g0.png','lab/g1.png');
            const motion=delta('lab/g1.png','lab/g2.png');
            const text=logs.join('\n')+'\n'+errors.join('\n');
            const launch=/Launching .*wine/i.test(text);
            const rundemo=/rundemo\.exe/i.test(text);
            const crash=/(starting debugger|wine debugger|winedbg|unhandled page fault|unhandled exception|assertion failed|double free|segmentation fault|unimplemented function|failed to initialize|RuntimeError)/i.test(text);
            const status=await page.locator('#statusText').textContent().catch(()=>null);
            const payloadStillPublic=fs.existsSync('hotd.zip');
            const pass=errors.length===0 && launch && rundemo && !crash && !payloadStillPublic && boot>0 && motion>0;

            fs.writeFileSync('report/final.env',[
              `PAGE_ERROR_COUNT=${errors.length}`,
              `WINE_LAUNCH=${launch}`,
              `RUNDEMO_SEEN=${rundemo}`,
              `CRASH_SIGNATURE=${crash}`,
              `PAYLOAD_PRESENT_IN_WEB_ROOT_AT_LAUNCH=${payloadStillPublic}`,
              `BOOT_DELTA=${boot}`,
              `POST_INPUT_DELTA=${motion}`,
              `PAGE_STATUS=${status}`,
              `PRIVATE_GATEWAY_PASS=${pass}`
            ].join('\n')+'\n');
            fs.writeFileSync('report/console.log',text);
            await browser.close();
            process.exit(pass?0:2);
          })().catch(e=>{console.error(e);process.exit(3);});
          NODE
          node lab/proof.js

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          kill "$(cat lab/http.pid 2>/dev/null)" 2>/dev/null || true
          rm -f hotd.zip lab/g0.png lab/g1.png lab/g2.png

      - name: Upload text-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotd-private-gateway-proof
          path: report
          retention-days: 14
