name: Sync BoxedWine Personal Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-boxedwine-personal-runtime.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOXEDWINE_WEB_BASE: https://boxedwine.org/v/26R1/wine6/st
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official BoxedWine 26R1 Wine6 single-threaded web stack
        shell: bash
        run: |
          set -euo pipefail
          DEST=vendor/boxedwine26r1
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cd "$DEST"
          curl --fail --location --retry 3 -o boxedwine.html "$BOXEDWINE_WEB_BASE/boxedwine.html"
          curl --fail --location --retry 3 -o boxedwine.zip "$BOXEDWINE_WEB_BASE/boxedwine.zip"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('boxedwine.html').read_text(errors='replace')
          refs=[]
          for pat in (r'<script[^>]+src=["\']([^"\']+)', r'<link[^>]+href=["\']([^"\']+)'):
              refs += re.findall(pat,s,re.I)
          refs += ['boxedwine.js','boxedwine.wasm','boxedwine-shell.js','boxedwine.css']
          keep=[]
          for x in refs:
              x=x.split('?',1)[0]
              if not x or '://' in x or x.startswith('/') or x.startswith('data:'):
                  continue
              if x not in keep:
                  keep.append(x)
          Path('assets.txt').write_text('\n'.join(keep)+'\n')
          PY
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "$(dirname "$f")"
            [ -f "$f" ] || curl --fail --location --retry 3 -o "$f" "$BOXEDWINE_WEB_BASE/$f"
          done < assets.txt
          rm assets.txt
          unzip -tq boxedwine.zip >/dev/null
          test -s boxedwine.js
          test -s boxedwine.wasm
          test -s boxedwine-shell.js
          ! find . -type f -iname '*hotd*' | grep -q .

      - name: Commit open-source runtime only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/boxedwine26r1
          if git diff --cached --quiet; then
            echo 'Runtime already current'
            exit 0
          fi
          git commit -m 'Vendor BoxedWine 26R1 personal runtime'
          git push
