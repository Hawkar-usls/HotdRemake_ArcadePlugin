name: HOTD 1997 PC Zone Container Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotd1997-pczone-unar-probe.yml'

permissions:
  contents: read

jobs:
  inspect-cover-cd:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CD_ARCHIVE: https://pixsoriginadventures.co.uk/PCZone/PC%20Zone%2067%20%28September%201998%29/CDZone%2367.rar
    steps:
      - name: Install CloneCD and archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar p7zip-full ccd2iso file cabextract

      - name: Fetch and unpack historical cover CD ephemerally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pczone67v2/report" "$RUNNER_TEMP/pczone67v2/outer"
          cd "$RUNNER_TEMP/pczone67v2"
          curl --fail --location --retry 3 --retry-all-errors --output cdzone67.rar "$CD_ARCHIVE"
          {
            echo "OUTER_BYTES=$(stat -c %s cdzone67.rar)"
            echo "OUTER_SHA256=$(sha256sum cdzone67.rar | awk '{print $1}')"
            echo "OUTER_TYPE=$(file -b cdzone67.rar)"
            echo 'BINARY_PERSISTED=NO'
            echo 'BINARY_UPLOADED=NO'
          } | tee report/status.env
          unar -f -o outer cdzone67.rar > report/unar.log 2>&1
          echo OUTER_EXTRACT_PASS=true | tee -a report/status.env
          find outer -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort | tee report/outer-files.txt

      - name: Convert CloneCD IMG to ISO
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pczone67v2"
          IMG="$(find outer -type f -iname '*.img' -print -quit)"
          CCD="$(find outer -type f -iname '*.ccd' -print -quit || true)"
          CUE="$(find outer -type f -iname '*.cue' -print -quit || true)"
          test -n "$IMG"
          echo "CLONECD_IMG=${IMG#outer/}" | tee -a report/status.env
          [[ -n "$CCD" ]] && echo "CLONECD_CCD=${CCD#outer/}" | tee -a report/status.env
          [[ -n "$CUE" ]] && echo "CLONECD_CUE=${CUE#outer/}" | tee -a report/status.env
          ccd2iso "$IMG" cdzone67.iso > report/ccd2iso.log 2>&1
          test -s cdzone67.iso
          echo "ISO_BYTES=$(stat -c %s cdzone67.iso)" | tee -a report/status.env
          echo "ISO_SHA256=$(sha256sum cdzone67.iso | awk '{print $1}')" | tee -a report/status.env
          file -b cdzone67.iso | sed 's/^/ISO_TYPE=/' | tee -a report/status.env

      - name: Inspect and extract CD filesystem
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pczone67v2"
          mkdir -p cdroot
          7z l -slt cdzone67.iso > report/iso-list.txt
          grep -E -i -C 3 'hotd|house.?of.?the.?dead|dead' report/iso-list.txt > report/hotd-iso-hits.txt || true
          echo '--- HOTD ISO listing hits ---'
          cat report/hotd-iso-hits.txt || true
          7z x -y -ocdroot cdzone67.iso > report/iso-extract.log
          find cdroot -type f -printf '%p\n' | sort > report/cd-files.txt
          grep -E -i 'hotd|house.?of.?the.?dead' report/cd-files.txt > report/hotd-path-hits.txt || true
          echo '--- HOTD filesystem hits ---'
          cat report/hotd-path-hits.txt || true
          if [[ -s report/hotd-path-hits.txt || -s report/hotd-iso-hits.txt ]]; then
            echo HOTD_ENTRY_FOUND=true | tee -a report/status.env
          else
            echo HOTD_ENTRY_FOUND=false | tee -a report/status.env
          fi

      - name: Inspect HOTD demo installer and license evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pczone67v2"
          INSTALLER="$(find cdroot -type f -iname 'hotd_demo.exe' -print -quit || true)"
          if [[ -z "$INSTALLER" ]]; then
            INSTALLER="$(find cdroot -type f -iname '*hotd*.exe' -print -quit || true)"
          fi
          if [[ -z "$INSTALLER" ]]; then
            echo INSTALLER_FOUND=false | tee -a report/status.env
            exit 0
          fi
          echo INSTALLER_FOUND=true | tee -a report/status.env
          echo "INSTALLER_PATH=${INSTALLER#cdroot/}" | tee -a report/status.env
          echo "INSTALLER_BYTES=$(stat -c %s "$INSTALLER")" | tee -a report/status.env
          echo "INSTALLER_MD5=$(md5sum "$INSTALLER" | awk '{print $1}')" | tee -a report/status.env
          echo "INSTALLER_SHA256=$(sha256sum "$INSTALLER" | awk '{print $1}')" | tee -a report/status.env
          file -b "$INSTALLER" | sed 's/^/INSTALLER_TYPE=/' | tee -a report/status.env

          mkdir -p installer-inner
          7z l -slt "$INSTALLER" > report/installer-list.txt 2>&1 || true
          7z x -y -oinstaller-inner "$INSTALLER" > report/installer-extract.log 2>&1 || true

          : > report/license-candidates.txt
          : > report/license-evidence.txt
          PARENT="$(dirname "$INSTALLER")"
          for ROOT in "$PARENT" installer-inner; do
            [[ -d "$ROOT" ]] || continue
            find "$ROOT" -type f \( -iname 'readme*' -o -iname 'license*' -o -iname 'licence*' -o -iname 'eula*' -o -iname '*.txt' -o -iname '*.rtf' \) -print >> report/license-candidates.txt || true
          done
          sort -u -o report/license-candidates.txt report/license-candidates.txt

          {
            echo '===== INSTALLER STRINGS ====='
            strings -n 5 "$INSTALLER" | grep -E -i -C 3 'redistribut|distribut|copy|shareware|freeware|demo|license|licence|permission|may be (freely )?(copied|distributed)|not for resale' | head -n 260 || true
            while IFS= read -r f; do
              [[ -f "$f" ]] || continue
              echo "===== FILE: ${f#cdroot/} ====="
              strings -n 5 "$f" | grep -E -i -C 3 'redistribut|distribut|copy|shareware|freeware|demo|license|licence|permission|may be (freely )?(copied|distributed)|not for resale' | head -n 180 || true
            done < report/license-candidates.txt
          } > report/license-evidence.txt

          if grep -E -i -q 'may be (freely )?(copied|distributed)|freely distribut|redistribut' report/license-evidence.txt; then
            echo REDISTRIBUTION_TEXT_CANDIDATE=true | tee -a report/status.env
          else
            echo REDISTRIBUTION_TEXT_CANDIDATE=false | tee -a report/status.env
          fi
          echo LICENSE_TEXT_FOUND=true | tee -a report/status.env
          sed -n '1,380p' report/license-evidence.txt

      - name: Upload text-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotd1997-pczone67-clonecd-report
          path: ${{ runner.temp }}/pczone67v2/report
          if-no-files-found: warn
          retention-days: 30
